# Image-only compose for Synology Container Manager (no build context).
# Image lives in the NAS registry at /volume1/docker/registry (port 9500).
# Publish from the build machine, then create/recreate this project — CM pulls.
#
# On the NAS this file is named compose.yml (scripts/nas-sync.sh copies it).
# Do not leave the live project on compose.nas.yaml.
#
#   bash scripts/publish-registry.sh
#   bash scripts/nas-sync.sh
#
# CM registry: sigmanas.local:9500
# NAS dockerd insecure: 127.0.0.1:9500 (sigmanas.local → 127.0.0.1)
# user: is PUID/PGID. group_add 101 is DSM administrators — without it, uid 1026
# cannot read ACL-backed shares and the indexer walks empty /media placeholders.
# Do not set KORU_IDLE_SECS.
# musicVidoes is the existing DSM share name (typo kept).
# WebStation alias: KORU_BASE_PATH must match the alias (live: /medusha).
# Any alias works except /media — that name is the byte-stream route (GET /media/{id}).
# Settings (/medusha/settings) chooses which /media/* folders the binary indexer walks
# and tags each with capability/affordances. Bind mounts below are Compose/DSM;
# the process cannot remount shares. Add a host bind here before enabling a new path.
# /data and /config are host binds so catalog + settings.conf survive Watchtower.

services:
  media:
    image: sigmanas.local:9500/koru-orisha-media:latest
    pull_policy: always
    restart: unless-stopped
    user: "1026:100"
    group_add:
      - "101"
    ports:
      - "3090:3090"
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Europe/Berlin
      - KORU_MEDIA_ROOT=/media
      - KORU_CATALOG=/data/catalog.sqlite
      - KORU_MANIFEST=/data/manifest.json
      - KORU_SEMANTIC=/data/semantic.json
      - KORU_CONFIG=/config/settings.conf
      - KORU_BASE_PATH=/medusha
    volumes:
      - /volume1/docker/koru-orisha-media/config:/config
      - /volume1/docker/koru-orisha-media/data:/data
      - /volume1/movies:/media/movies:ro
      - /volume1/shows:/media/shows:ro
      - /volume1/music:/media/music:ro
      - /volume1/books:/media/books:ro
      - /volume1/musicVidoes:/media/musicVideos:ro
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=koru

  # Pulls sigmanas.local:9500/koru-orisha-media:latest. Recreate this project from
  # compose.yml so binds + group_add 101 are in HostConfig before Watchtower replaces
  # the container; Watchtower copies HostConfig and does not re-read this file.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_SCOPE=koru
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
