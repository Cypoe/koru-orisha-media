# Local runtime for koru-orisha-media (image: koru-orisha-media:local).
# Build: bash scripts/build-image.sh
# Run:   docker compose up
#
# Library layout (one bind, Jellyfin-style roots):
#   ./media/movies  ./media/shows  ./media/music
# Indexer walks that single root. Ensure ./data/manifest.json exists
# (or set KORU_REINDEX=1 once). data/ is gitignored local runtime;
# fixtures/ is the CI library.

services:
  media:
    build: .
    image: koru-orisha-media:local
    ports:
      - "3090:3090"
    environment:
      KORU_MEDIA_ROOT: /media
      KORU_MANIFEST: /data/manifest.json
      KORU_SEMANTIC: /data/semantic.json
      # Uncomment once to (re)build the manifest from /media:
      # KORU_REINDEX: "1"
    volumes:
      - ./media:/media:ro
      - ./data:/data
    restart: unless-stopped
