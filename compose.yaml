# Local runtime for koru-orisha-media (image: koru-orisha-media:local).
# Build: bash scripts/build-image.sh
# Run:   docker compose up
#
# Library layout (one bind, Jellyfin-style roots):
#   ./media/movies  ./media/shows  ./media/music
# Empty /data/catalog.sqlite walks /media on boot when binds have files.
# data/ and config/ are gitignored local runtime; fixtures/ is the CI library.

services:
  media:
    build: .
    image: koru-orisha-media:local
    pull_policy: never
    ports:
      - "3090:3090"
    environment:
      KORU_MEDIA_ROOT: /media
      KORU_CATALOG: /data/catalog.sqlite
      KORU_MANIFEST: /data/manifest.json
      KORU_SEMANTIC: /data/semantic.json
      KORU_CONFIG: /config/settings.conf
      # Uncomment once to (re)walk /media into the catalog:
      # KORU_REINDEX: "1"
      # Overlay tables only (no provider HTTP). Hydrate is host-side Python:
      # KORU_HYDRATE: "1"
      # WebStation-style path prefix (empty in local compose). Not /media:
      # KORU_BASE_PATH: /medusha
    volumes:
      - ./media:/media:ro
      - ./data:/data
      - ./config:/config
    restart: unless-stopped
