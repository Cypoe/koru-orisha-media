<section class="settings-section"><h2>Sign-in</h2><p class="lede">Household password becomes a session cookie. Leave the field blank to keep the current hash. DSM reverse-proxy users can pass a forwarded-user header instead.</p><label>Password <input type="password" name="login_password" value="" maxlength="120" autocomplete="new-password" placeholder="{{ph_password}}"></label><label class="mount-check"><input type="hidden" name="trust_proxy_user" value="0"><input type="checkbox" name="trust_proxy_user" value="1"{{trust_checked}}> Trust proxy user header</label><label>Proxy user header <input type="text" name="proxy_user_header" value="{{proxy_hdr}}" maxlength="60" spellcheck="false" placeholder="X-Forwarded-User"></label></section>
