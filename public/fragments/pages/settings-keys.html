<section class="settings-section"><h2>Catalogue keys</h2><p class="lede">Optional TMDB and TVDB credentials live in this settings file on the config bind. Hydrate fetches IMDb metadata without them. Empty token fields leave the saved value unchanged.</p><label>TMDB access token <input type="password" name="tmdb_token" value="" maxlength="240" autocomplete="off" placeholder="{{ph_tmdb_token}}"></label><label>TMDB API key <input type="password" name="tmdb_api_key" value="" maxlength="80" autocomplete="off" placeholder="{{ph_tmdb_key}}"></label><label>TVDB API key <input type="password" name="tvdb_api_key" value="" maxlength="80" autocomplete="off" placeholder="{{ph_tvdb_key}}"></label><label>TVDB PIN <input type="password" name="tvdb_pin" value="" maxlength="40" autocomplete="off" placeholder="{{ph_tvdb_pin}}"></label></section>
