<section class="settings-section"><h2>Base path</h2><p class="lede">WebStation alias / reverse-proxy prefix. Saved under <code>{{config}}</code>. Compose env <code>KORU_BASE_PATH</code> is the fallback when this field is empty. On the NAS stack the live alias is <code>/medusha</code> — WebStation must match. Do not use <code>/media</code> — that name is the byte-stream route.</p><label>Base path <input type="text" name="base_path" value="{{alias}}" maxlength="80" spellcheck="false" placeholder="/medusha"></label></section>
